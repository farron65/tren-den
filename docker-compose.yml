services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - "backend/.env"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://127.0.0.1:8000

    ports:
      - "8080:80"

  db:
    image: postgres
    container_name: trenden-db-1
    environment: 
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydb
    volumes:
      - td_data:/var/lib/postgresql/
    ports:
      - "5432:5432"

volumes:
  td_data: